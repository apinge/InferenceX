name: SGLang Benchmark Workflow

# Runs only for PRs targeting local_benchmark_mi355, or manual runs from that branch.
on:
  pull_request:
    branches:
      - local_benchmark_mi355
  workflow_dispatch:
    inputs:
      model_list:
        description: 'Model list to benchmark on MI355X (JSON array format, default: ["Qwen3.5-397B-A17B"])'
        required: false
        default: '["Qwen3.5-397B-A17B"]'
      image:
        description: 'Image to use for the benchmark (default: "rocm/sgl-dev:v0.5.9-rocm720-mi35x-20260315")'
        required: true
        default: "rocm/sgl-dev:v0.5.9-rocm720-mi35x-20260315"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ github.event.inputs.image || 'rocm/sgl-dev:v0.5.9-rocm720-mi35x-20260315' }}
  SGLANG_GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
  SGLANG_GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.head_commit.id || github.sha }}

jobs:
  benchmark:
    # PRs: already limited to base branch local_benchmark_mi355. Manual: only that branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/local_benchmark_mi355'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(github.event.inputs.model_list || '["Qwen3.5-397B-A17B"]') }} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download SGLang Image
        run: |
          pull_success=false
          for i in 1 2 3; do
            if docker pull ${{ env.IMAGE }}; then
              pull_success=true
              break
            else
              echo "docker pull failed, retrying ($i/3)..."
              sleep 5
            fi
          done
          if [ "$pull_success" != "true" ]; then
            echo "docker pull failed after 3 attempts."
            exit 1
          fi
      
      - name: Generate Dockerfile
        run: |
          if [ -z "${{ env.SGLANG_GITHUB_COMMIT_SHA }}" ]; then
            echo "SGLANG_GITHUB_COMMIT_SHA is empty; cannot pin checkout."
            exit 1
          fi
          cat <<'EOF' > Dockerfile.mod
          FROM ${{ env.IMAGE }}
          RUN git clone ${{ env.SGLANG_GITHUB_REPO_URL }} /inferencex_checkout && \
              cd /inferencex_checkout && \
              git fetch origin ${{ env.SGLANG_GITHUB_COMMIT_SHA }} && \
              git checkout ${{ env.SGLANG_GITHUB_COMMIT_SHA }} && \
              pip install --upgrade tabulate
          EOF

      - name: Show dockerfile
        run: |
          cat Dockerfile.mod 

      - name: Build Docker image
        run: |
          docker build --no-cache --network=host -t "sglang_test:ci" -f Dockerfile.mod .
          # Remove dangling images from this build to free disk
          docker image prune -f
          # Remove build cache to free more disk
          docker builder prune -f

      
